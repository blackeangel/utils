name: Release (libarchive)

on:
  push:
    tags:
      - 'v*-libarchive'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-libarchive)'
        required: true

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: utils_libarchive

      - name: Install dependencies
        run: sudo apt-get install -y ninja-build libarchive-dev

      - name: Configure
        run: |
          cmake -S . -B build-linux \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux -- -j$(nproc)

      - name: Package
        run: |
          chmod +x out/utils
          tar czf utils-libarchive_linux_x86_64.tar.gz -C out utils

      - uses: actions/upload-artifact@v6
        with:
          name: utils-libarchive_linux_x86_64
          path: utils-libarchive_linux_x86_64.tar.gz
          retention-days: 1

  # ── Windows x86_64 (MinGW-w64) ───────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: utils_libarchive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libarchive
            git
            zip

      - name: Configure
        run: |
          cmake -S . -B build-windows -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build-windows -- -j$(nproc)

      - name: Package
        run: zip utils-libarchive_windows_x86_64.zip out/utils.exe

      - uses: actions/upload-artifact@v6
        with:
          name: utils-libarchive_windows_x86_64
          path: utils-libarchive_windows_x86_64.zip
          retention-days: 1

  # ── Android NDK — CMake matrix (4 ABI) ───────────────────────────────────────
  build-android-cmake:
    name: Android/${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [ armeabi-v7a, arm64-v8a, x86, x86_64 ]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: utils_libarchive

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-${{ matrix.abi }} -GNinja \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_NATIVE_API_LEVEL=30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-${{ matrix.abi }} -- -j$(nproc)

      - name: Package
        run: |
          cp out/utils utils-libarchive_android_${{ matrix.abi }}
          zip utils-libarchive_android_${{ matrix.abi }}.zip \
              utils-libarchive_android_${{ matrix.abi }}

      - uses: actions/upload-artifact@v6
        with:
          name: utils-libarchive_android_${{ matrix.abi }}
          path: utils-libarchive_android_${{ matrix.abi }}.zip
          retention-days: 1

  # ── Android — ndk-build (armeabi-v7a + arm64-v8a) ────────────────────────────
  build-android-ndk:
    name: Android ndk-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: utils_libarchive

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build
        run: |
          ${{ steps.ndk.outputs.ndk-path }}/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APP_LIBS_OUT=out/ndk \
            NDK_APPLICATION_MK=Application.mk \
            -j$(nproc)

      - name: Package
        run: |
          for abi in armeabi-v7a arm64-v8a; do
            f="out/ndk/${abi}/bin_utils"
            if [ -f "$f" ]; then
              cp "$f" "utils-libarchive_android_ndk_${abi}"
              zip "utils-libarchive_android_ndk_${abi}.zip" \
                  "utils-libarchive_android_ndk_${abi}"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: utils-libarchive_android_ndk
          path: utils-libarchive_android_ndk_*.zip
          retention-days: 1

  # ── Publish GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [ build-linux, build-windows, build-android-cmake, build-android-ndk ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: utils_libarchive

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Flat listing ==="
          ls -lh artifacts/ 2>/dev/null || true
          echo "=== Recursive listing ==="
          find artifacts -type f | sort

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        run: |
          TAG=${{ steps.tag.outputs.name }}
          cat > release_notes.md << NOTES
          ## utils ${TAG} — libarchive branch

          Experimental branch using dedicated compression libraries per format:

          | Format | Library |
          |--------|---------|
          | tar / cpio / format detection | libarchive |
          | zip | libzip |
          | gzip / deflate | zlib |
          | xz / lzma | liblzma |
          | bzip2 | libbz2 |
          | lz4 | liblz4 |
          | lzo | liblzo2 |
          | zstd | libzstd |
          | brotli | libbrotli |

          ### Downloads / Платформы

          | File | Platform |
          |------|----------|
          | \`utils-libarchive_linux_x86_64.tar.gz\` | Linux x86_64 |
          | \`utils-libarchive_windows_x86_64.zip\` | Windows x86_64 |
          | \`utils-libarchive_android_arm64-v8a.zip\` | Android ARM64 (CMake) |
          | \`utils-libarchive_android_armeabi-v7a.zip\` | Android ARMv7 (CMake) |
          | \`utils-libarchive_android_x86_64.zip\` | Android x86_64 (CMake) |
          | \`utils-libarchive_android_x86.zip\` | Android x86 (CMake) |
          | \`utils-libarchive_android_ndk_arm64-v8a.zip\` | Android ARM64 (ndk-build) |
          | \`utils-libarchive_android_ndk_armeabi-v7a.zip\` | Android ARMv7 (ndk-build) |

          ### New in this branch

          - **tar_repacker** — extract/pack Android TAR with PAX/SELinux/capabilities
          - All binaries: statically linked, stripped

          See [README](https://github.com/${{ github.repository }}/blob/utils_libarchive/README.md) for full usage.
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: utils ${{ steps.tag.outputs.name }}
          body_path: release_notes.md
          draft: false
          prerelease: true
          target_commitish: utils_libarchive
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
