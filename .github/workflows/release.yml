name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build-linux/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-linux-

      - name: Configure
        run: cmake -S . -B build-linux -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux -- -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utils_linux_x86_64
          path: out/utils
          retention-days: 1

  # ── Windows x86_64 (MinGW-w64) ───────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build-windows/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-windows-

      - name: Configure
        run: |
          cmake -S . -B build-windows -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build-windows -- -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utils_windows_x86_64
          path: out/utils.exe
          retention-days: 1

  # ── Android matrix ───────────────────────────────────────────────────────────
  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [ armeabi-v7a, arm64-v8a, x86, x86_64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build-android-${{ matrix.abi }}/_deps
          key: deps-android-${{ matrix.abi }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-android-${{ matrix.abi }}-

      - name: Configure
        run: |
          cmake -S . -B build-android-${{ matrix.abi }} -GNinja \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_NATIVE_API_LEVEL=30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-android-${{ matrix.abi }} -- -j$(nproc)

      - name: Rename binary
        run: cp out/utils utils_android_${{ matrix.abi }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utils_android_${{ matrix.abi }}
          path: utils_android_${{ matrix.abi }}
          retention-days: 1

  # ── Publish GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [ build-linux, build-windows, build-android ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Package artifacts
        run: |
          cd artifacts
          # Linux — tar.gz
          chmod +x utils_linux_x86_64
          tar czf utils_linux_x86_64.tar.gz utils_linux_x86_64
          # Windows — zip
          zip utils_windows_x86_64.zip utils_windows_x86_64.exe 2>/dev/null || \
            zip utils_windows_x86_64.zip utils.exe 2>/dev/null || true
          # Android — zip per ABI
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            [ -f "utils_android_${abi}" ] && zip "utils_android_${abi}.zip" "utils_android_${abi}"
          done
          ls -lh *.tar.gz *.zip

      - name: Generate release notes
        run: |
          TAG=${{ steps.tag.outputs.name }}
          cat > release_notes.md << 'EOF'
          ## utils TAG_PLACEHOLDER

          ### Platforms / Платформы

          | File / Файл | Platform / Платформа |
          |---|---|
          | `utils_linux_x86_64.tar.gz` | Linux x86_64 |
          | `utils_windows_x86_64.zip` | Windows x86_64 |
          | `utils_android_arm64-v8a.zip` | Android ARM64 (современные / modern) |
          | `utils_android_armeabi-v7a.zip` | Android ARMv7 (старые / older) |
          | `utils_android_x86_64.zip` | Android x86_64 (эмулятор / emulator) |
          | `utils_android_x86.zip` | Android x86 (эмулятор / emulator) |

          ### Installation / Установка

          **Linux:**
          ```bash
          tar xzf utils_linux_x86_64.tar.gz
          chmod +x utils_linux_x86_64
          ./utils_linux_x86_64 help
          ```

          **Windows:**
          ```
          unzip utils_windows_x86_64.zip
          utils_windows_x86_64.exe help
          ```

          **Android:**
          ```bash
          unzip utils_android_arm64-v8a.zip
          chmod +x utils_android_arm64-v8a
          ./utils_android_arm64-v8a help
          ```

          ### Functions / Функции

          `block_finder` `chunk_split` `copy` `cut` `delgaaps`
          `file_explorer` `foffset` `fstab_fix` `hexpatch` `insert`
          `kerver` `logo_mtk` `md1img` `sdat2img` `shared_block_detector`
          `writekey` `avb_fixed` `append2simg` `img2simg` `simg2img` `simg2simg`

          See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full usage.
          EOF
          sed -i "s/TAG_PLACEHOLDER/${TAG}/" release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: utils ${{ steps.tag.outputs.name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/utils_linux_x86_64.tar.gz
            artifacts/utils_windows_x86_64.zip
            artifacts/utils_android_armeabi-v7a.zip
            artifacts/utils_android_arm64-v8a.zip
            artifacts/utils_android_x86.zip
            artifacts/utils_android_x86_64.zip
