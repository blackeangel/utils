name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Cache FetchContent (xz)
        uses: actions/cache@v5
        with:
          path: build-linux/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-linux-

      - name: Configure
        run: cmake -S . -B build-linux -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux -- -j$(nproc)

      - name: Check binary
        run: |
          file out/utils
          ./out/utils help | head -5

  # ── Windows x86_64 (MinGW-w64) ───────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Cache FetchContent (xz)
        uses: actions/cache@v5
        with:
          path: build-windows/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-windows-

      - name: Configure
        run: |
          cmake -S . -B build-windows -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build-windows -- -j$(nproc)

      - name: Check binary
        run: |
          file out/utils.exe
          ./out/utils.exe help | head -5

  # ── Android (NDK, matrix) ────────────────────────────────────────────────────
  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [ armeabi-v7a, arm64-v8a ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-${{ matrix.abi }} -GNinja \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_NATIVE_API_LEVEL=30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-${{ matrix.abi }} -- -j$(nproc)

      - name: Check binary
        run: file out/utils
